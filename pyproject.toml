[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-mock"
version = "1.0.0"
description = "Serve a contract-valid, deterministic mock API from any OpenAPI 3 spec: schema-aware fake data, request validation, latency/error injection and request replay checks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kele" }]
keywords = ["openapi", "mock", "api", "testing", "cli", "contract"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7.4", "ruff>=0.5", "PyYAML>=6.0"]

[project.scripts]
openapi-mock = "openapi_mock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Let "pytest -q" work from a fresh clone without pip install -e . (CI still installs).
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"