name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: python -m openapi_mock --help
      - run: python -m openapi_mock summary examples/petstore.json --json > /dev/null
      - run: python -m openapi_mock validate --requests examples/requests.log --spec examples/petstore.json || test $? -eq 1
      - run: python benchmarks/run.py
